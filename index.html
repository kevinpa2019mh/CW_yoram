<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>교회 요람 · 사진 찾기</title><style>
:root{--paper:#F5F3EC;--card:#FFF;--ink:#26303A;--ink-soft:#5D6B78;--brass:#A6813C;--brass-soft:#EFE6D2;--line:#E4E0D6;--shadow:0 1px 3px rgba(38,48,58,.08),0 6px 18px rgba(38,48,58,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 110px}
header.top{position:sticky;top:0;z-index:20;background:rgba(245,243,236,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -16px 12px;padding:13px 16px 9px}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0}
.brand .cnt{font-size:13px;color:var(--ink-soft);font-weight:600}
.searchbox{position:relative;margin-bottom:4px}
.searchbox input{width:100%;font-size:19px;padding:14px 44px 14px 44px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);outline:none;font-weight:500}
.searchbox input:focus{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
.searchbox .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink-soft)}
.searchbox .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:var(--line);color:var(--ink);width:30px;height:30px;border-radius:50%;font-size:17px;cursor:pointer;display:none;align-items:center;justify-content:center}
.searchbox .clear.show{display:flex}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:14px;font-weight:600;padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);cursor:pointer;text-decoration:none;display:inline-block}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:5px;font-size:12px}
.grp{margin-bottom:8px;scroll-margin-top:150px}
.ghead{font-size:15px;font-weight:800;color:var(--brass);margin:16px 2px 10px;display:flex;align-items:center;gap:8px}
.ghead .gcount{font-size:12px;font-weight:700;color:var(--ink-soft);background:var(--brass-soft);padding:2px 9px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.card{font:inherit;text-align:left;padding:0;border:1px solid var(--line);background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
.card:active{transform:scale(.97)}
.card .ph{width:100%;aspect-ratio:3/4;object-fit:cover;background:#EDEAE1;display:block}
.card .meta{padding:9px 12px 11px}
.card .nm{font-size:19px;font-weight:700;letter-spacing:-.01em}
.card .rl{display:inline-block;margin-top:5px;font-size:12px;font-weight:700;color:var(--brass);background:var(--brass-soft);padding:3px 9px;border-radius:999px}
.hide{display:none!important}
.empty{text-align:center;color:var(--ink-soft);padding:50px 20px;font-size:16px}
.empty b{color:var(--ink)}
.jsoff{background:var(--brass-soft);color:#6f571f;border-radius:12px;padding:11px 14px;font-size:13.5px;margin:6px 0 2px;line-height:1.45}
.ov{position:fixed;inset:0;background:rgba(24,30,36,.55);display:none;align-items:flex-end;justify-content:center;z-index:40}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:8px 20px 26px;animation:up .22s}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grip{width:42px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 14px}
.detail{display:flex;gap:18px;align-items:center}
.detail img{width:140px;aspect-ratio:3/4;object-fit:cover;border-radius:14px;background:#EDEAE1;flex:none}
.detail .dn{font-size:30px;font-weight:800;letter-spacing:-.02em}
.detail .dr{margin-top:8px;font-size:15px;font-weight:700;color:var(--brass);background:var(--brass-soft);padding:5px 12px;border-radius:999px;display:inline-block}
.rowbtns{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;font:inherit;text-align:center;font-size:16px;font-weight:700;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.danger{color:#B23B3B;border-color:#EAD3D3}
.adminbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;max-width:900px;margin:0 auto}
.toggle{position:fixed;right:16px;bottom:16px;z-index:31;background:var(--ink);color:#fff;border:none;border-radius:999px;padding:12px 18px;font-size:14px;font-weight:700;box-shadow:var(--shadow);cursor:pointer}
.form label{display:block;font-size:13px;font-weight:700;color:var(--ink-soft);margin:14px 0 6px}
.form input{width:100%;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
.photopick{display:flex;align-items:center;gap:14px;margin-top:6px}
.photopick img{width:84px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#EDEAE1}
.savehint{background:var(--brass-soft);color:#7a5e28;font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;margin-top:8px}
body:not(.js) .js-only{display:none!important}
body.js .nojs-only{display:none!important}


.rolemenu{position:relative;margin:2px 0 12px}
.rolemenu>summary{list-style:none;cursor:pointer;font-size:16px;font-weight:700;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);display:flex;align-items:center;gap:8px}
.rolemenu>summary::-webkit-details-marker{display:none}
.rolemenu>summary .rlab{flex:1 1 auto}
.rolemenu>summary .caret{color:var(--ink-soft);font-size:12px;transition:transform .15s}
.rolemenu[open]>summary{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
.rolemenu[open]>summary .caret{transform:rotate(180deg)}
.rolelist{position:static;margin-top:6px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:2px}
.rolelist .chip{border:none;background:transparent;border-radius:9px;text-align:left;padding:13px 12px;font-size:16px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between;align-items:center;white-space:nowrap;cursor:pointer;text-decoration:none}
.rolelist .chip:active{background:#F0ECE1}
.rolelist .chip.active{background:var(--brass-soft)}
.rolelist .chip .n{opacity:.55;font-weight:600;font-size:13px}
</style></head><body><div class="wrap"><a id="top"></a><header class="top"><div class="brand"><h1>교회 요람 · 사진 찾기</h1><span class="cnt" id="cnt"></span></div><div class="searchbox" id="searchbox" style="display:none"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="q" type="search" inputmode="search" placeholder="이름을 입력하세요 (예: 김영순)" autocomplete="off"><button class="clear" id="clr">×</button></div></header><details class="rolemenu" id="rolemenu"><summary id="roleSummary"><span class="rlab">직분 선택 (전체 보기)</span><span class="caret">▾</span></summary><div class="rolelist" id="rolelist"></div></details><div id="loading" class="empty">명단을 불러오는 중…</div><div id="list"></div><div class="empty hide" id="empty">검색 결과가 없습니다.</div></div><button class="toggle" id="adminToggle">관리 모드</button><div class="adminbar hide" id="adminbar"><button class="btn primary" id="addBtn">+ 추가</button><button class="btn" id="exportBtn">내보내기</button></div><div class="ov" id="detailOv"><div class="sheet"><div class="grip"></div><div class="detail"><img id="dImg" alt=""><div><div class="dn" id="dName"></div><div class="dr" id="dRole"></div></div></div><div class="rowbtns" id="detailBtns"></div></div></div><div class="ov" id="editOv"><div class="sheet"><div class="grip"></div><div class="form"><label>이름</label><input id="fName" placeholder="이름"><label>직분</label><input id="fRole" placeholder="예: 시무권사"><label>사진</label><div class="photopick"><img id="fImg" alt=""><input type="file" id="fFile" accept="image/*"></div><div class="savehint">이 수정은 <b>내 폰에만</b> 저장됩니다. 전체 반영은 관리자가 data.json을 교체해야 합니다.</div></div><div class="rowbtns"><button class="btn" id="cancelEdit">취소</button><button class="btn primary" id="saveEdit">저장</button></div><div class="rowbtns" style="margin-top:10px"><button class="btn danger hide" id="deleteEntry">이 사람 삭제</button></div></div></div><script>
var ROLE_ORDER=["시무장로","원로장로","은퇴장로","협동장로","안수집사","은퇴집사","협동안수집사","명예집사(남)","시무권사","은퇴권사","협동권사","명예권사","명예집사(여)"];
var SIL="";
var people=[], q="", activeRole="전체";
var KEY="church_dir_ops_v3";
var ops={mods:{},dels:[],adds:[]};
try{var s=localStorage.getItem(KEY); if(s) ops=JSON.parse(s);}catch(e){}
function saveOps(){try{localStorage.setItem(KEY,JSON.stringify(ops));}catch(e){}}

function esc(t){return (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function buildFromData(raw){
  // assign ids by index; apply local ops overlay
  people = raw.map(function(p,i){return {id:"s"+i, name:p.name, role:p.role, img:p.img};});
  var del={}; (ops.dels||[]).forEach(function(id){del[id]=1;});
  people = people.filter(function(p){return !del[p.id];}).map(function(p){
    var m=ops.mods[p.id]; if(m){return {id:p.id,name:m.name,role:m.role,img:m.img||p.img};} return p;
  });
  (ops.adds||[]).forEach(function(a){ if(!del[a.id]) people.push({id:a.id,name:a.name,role:a.role,img:a.img}); });
}
function rolesInOrder(){
  var present={}; people.forEach(function(p){present[p.role]=(present[p.role]||0)+1;});
  var out=[]; ROLE_ORDER.forEach(function(r){if(present[r])out.push([r,present[r]]);});
  Object.keys(present).forEach(function(r){if(ROLE_ORDER.indexOf(r)<0)out.push([r,present[r]]);});
  return out;
}
function render(){
  var listEl=document.getElementById('list');
  var groups={}; people.forEach(function(p){(groups[p.role]=groups[p.role]||[]).push(p);});
  var order=rolesInOrder();
  var htmlp="";
  order.forEach(function(pair){
    var r=pair[0]; var g=groups[r].slice().sort(function(a,b){return a.name<b.name?-1:1;});
    var cards="";
    g.forEach(function(p){
      cards+='<button class="card" data-id="'+p.id+'" data-name="'+esc(p.name)+'" data-role="'+esc(r)+'">'
        +'<img class="ph" loading="lazy" src="'+p.img+'" alt="'+esc(p.name)+'">'
        +'<div class="meta"><div class="nm">'+esc(p.name)+'</div><span class="rl">'+esc(r)+'</span></div></button>';
    });
    htmlp+='<section class="grp" id="grp-'+r+'"><h2 class="ghead">'+r+'<span class="gcount">'+g.length+'</span></h2><div class="grid">'+cards+'</div></section>';
  });
  listEl.innerHTML=htmlp;
  // dropdown menu
  var menu='<a class="chip active" href="#top" data-role="전체">전체 직분<span class="n">'+people.length+'</span></a>';
  order.forEach(function(pair){menu+='<a class="chip" href="#grp-'+pair[0]+'" data-role="'+pair[0]+'">'+pair[0]+'<span class="n">'+pair[1]+'</span></a>';});
  document.getElementById('rolelist').innerHTML=menu;
  document.getElementById('cnt').textContent="총 "+people.length+"명";
  wireCards(); wireMenu(); apply();
}
function apply(){
  var qq=q.trim(), any=false;
  var cards=document.querySelectorAll('.card');
  cards.forEach(function(c){
    var okR=(activeRole==="전체"||c.dataset.role===activeRole);
    var okQ=(!qq||c.dataset.name.indexOf(qq)>=0);
    var show=okR&&okQ; c.classList.toggle('hide',!show); if(show)any=true;
  });
  document.querySelectorAll('.grp').forEach(function(sx){
    sx.classList.toggle('hide', sx.querySelectorAll('.card:not(.hide)').length===0);
  });
  document.getElementById('empty').classList.toggle('hide',any);
  document.getElementById('clr').classList.toggle('show',qq.length>0);
}
function findById(id){for(var i=0;i<people.length;i++)if(people[i].id===id)return people[i];return null;}
var adminOn=false, editing=null, pendingImg=null;
function wireCards(){
  document.querySelectorAll('.card').forEach(function(c){
    c.onclick=function(){openDetail(c.dataset.id);};
  });
}
function wireMenu(){
  var dt=document.getElementById('rolemenu'), sm=document.getElementById('roleSummary');
  document.querySelectorAll('#rolemenu .chip').forEach(function(a){
    a.onclick=function(e){
      e.preventDefault(); activeRole=a.dataset.role;
      document.querySelectorAll('#rolemenu .chip').forEach(function(x){x.classList.toggle('active',x===a);});
      sm.innerHTML='<span class="rlab">'+a.dataset.role+'</span><span class="caret">\u25be</span>';
      dt.open=false; apply(); window.scrollTo({top:0,behavior:'smooth'});
    };
  });
}
function openDetail(id){
  var p=findById(id); if(!p)return;
  document.getElementById('dImg').src=p.img||'';
  document.getElementById('dName').textContent=p.name;
  document.getElementById('dRole').textContent=p.role||'';
  var b=document.getElementById('detailBtns');
  b.innerHTML='<button class="btn" onclick="closeOv(\'detailOv\')">닫기</button>';
  if(adminOn){var e=document.createElement('button');e.className='btn primary';e.textContent='수정';e.onclick=function(){closeOv('detailOv');openEdit(id);};b.appendChild(e);}
  showOv('detailOv');
}
function openEdit(id){
  editing=id; pendingImg=null;
  var p=id?findById(id):{name:'',role:(activeRole!=="전체"?activeRole:''),img:''};
  document.getElementById('fName').value=p.name||'';
  document.getElementById('fRole').value=p.role||'';
  document.getElementById('fImg').src=p.img||SIL;
  document.getElementById('fFile').value='';
  document.getElementById('deleteEntry').classList.toggle('hide',!id);
  showOv('editOv');
}
document.getElementById('fFile').addEventListener('change',function(e){
  var f=e.target.files[0]; if(!f)return; var r=new FileReader();
  r.onload=function(){pendingImg=r.result;document.getElementById('fImg').src=r.result;}; r.readAsDataURL(f);
});
document.getElementById('saveEdit').onclick=function(){
  var name=document.getElementById('fName').value.trim(), role=document.getElementById('fRole').value.trim();
  if(!name){alert('이름을 입력하세요.');return;}
  if(editing){
    if(editing.charAt(0)==='a'){var a=null;(ops.adds||[]).forEach(function(x){if(x.id===editing)a=x;});if(a){a.name=name;a.role=role;if(pendingImg)a.img=pendingImg;}}
    else{var m=ops.mods[editing]||{};m.name=name;m.role=role;if(pendingImg)m.img=pendingImg; if(!m.img)m.img=(findById(editing)||{}).img; ops.mods[editing]=m;}
  }else{
    ops.adds=ops.adds||[]; ops.adds.push({id:"a"+Date.now(),name:name,role:role,img:pendingImg||SIL});
  }
  saveOps(); buildFromData(window.__RAW__); render(); closeOv('editOv');
};
document.getElementById('deleteEntry').onclick=function(){
  if(!editing)return; var p=findById(editing);
  if(confirm((p?p.name:'')+' 님을 삭제할까요?')){
    if(editing.charAt(0)==='a'){ops.adds=(ops.adds||[]).filter(function(x){return x.id!==editing;});}
    else{if((ops.dels||[]).indexOf(editing)<0){ops.dels=ops.dels||[];ops.dels.push(editing);}}
    saveOps(); buildFromData(window.__RAW__); render(); closeOv('editOv');
  }
};
document.getElementById('cancelEdit').onclick=function(){closeOv('editOv');};
document.getElementById('adminToggle').onclick=function(){
  adminOn=!adminOn; document.getElementById('adminbar').classList.toggle('hide',!adminOn);
  this.textContent=adminOn?'보기 모드':'관리 모드';
};
document.getElementById('addBtn').onclick=function(){openEdit(null);};
document.getElementById('exportBtn').onclick=function(){
  var out=people.map(function(p){return {name:p.name,role:p.role,img:p.img};});
  var blob=new Blob([JSON.stringify(out)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='data.json'; a.click();
};
function showOv(id){document.getElementById(id).classList.add('show');}
function closeOv(id){document.getElementById(id).classList.remove('show');}
document.querySelectorAll('.ov').forEach(function(ov){ov.addEventListener('click',function(e){if(e.target===ov)ov.classList.remove('show');});});
document.getElementById('q').addEventListener('input',function(){q=this.value;apply();});
document.getElementById('clr').onclick=function(){document.getElementById('q').value='';q='';apply();document.getElementById('q').focus();};
document.addEventListener('click',function(e){var dt=document.getElementById('rolemenu'); if(dt&&dt.open&&!dt.contains(e.target))dt.open=false;});
window.openDetail=openDetail; window.closeOv=closeOv;

// ---- load data.json ----
document.getElementById('searchbox').style.display='block';
fetch('data.json?v='+Date.now()).then(function(r){return r.json();}).then(function(raw){
  window.__RAW__=raw;
  if(raw.length){ /* derive silhouette from first entry that is svg, else default */
    for(var i=0;i<raw.length;i++){ if((raw[i].img||'').indexOf('image/svg')>=0){SIL=raw[i].img;break;} }
  }
  buildFromData(raw); render();
  document.getElementById('loading').style.display='none';
}).catch(function(err){
  document.getElementById('loading').innerHTML='데이터를 불러오지 못했습니다.<br>data.json 파일이 index.html과 같은 위치에 있어야 합니다.<br><small>(파일을 직접 열면 브라우저 보안상 차단될 수 있어, 웹링크로 열어주세요.)</small>';
});
</script></body></html>
